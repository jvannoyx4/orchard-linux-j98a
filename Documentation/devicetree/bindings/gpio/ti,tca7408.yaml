%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/ti,tca7408.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments TCA7408 I2C GPIO expander

maintainers:
  - Linux GPIO mailing list <linux-gpio@vger.kernel.org>

properties:
  compatible:
    const: ti,tca7408

  reg:
    enum: [0x43, 0x44]

  gpio-controller: true

  "#gpio-cells":
    const: 2

  gpio-line-names:
    minItems: 1
    maxItems: 8

required:
  - compatible
  - reg
  - gpio-controller
  - "#gpio-cells"

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        gpio@43 {
            compatible = "ti,tca7408";
            reg = <0x43>;
            gpio-controller;
            #gpio-cells = <2>;
        };
    };
